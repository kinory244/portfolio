<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curriculum Vitae</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="cv-wrapper">
<div class="cv" id="cv"></div>
</div>
<script>
const ICONS = {
  'phone': `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/></svg>`,
  'mail': `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>`,
  'globe': `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/></svg>`
};

function esc(s){const e=document.createElement('span');e.textContent=s;return e.innerHTML;}

async function render(){
  const d=await(await fetch('data.json')).json();
  document.documentElement.lang=d.meta.lang;
  document.title=d.meta.title;

  const bioHtml = Array.isArray(d.persona.bio)
    ? d.persona.bio.map(p=>esc(p)).join(' ')
    : esc(d.persona.bio);

  const sidebar=`
  <aside class="sidebar">
    <div class="sidebar-header">
      ${d.persona.photo
        ? `<img class="avatar-photo" src="${esc(d.persona.photo)}" alt="${esc(d.persona.firstName+' '+d.persona.lastName)}">`
        : `<div class="avatar-circle">${esc(d.persona.initials)}</div>`}
    </div>
    <div class="sidebar-body">

      <div class="s-block">
        <div class="s-title">Contact</div>
        <div class="ct-list">
          ${d.contacts.map(c=>`<div class="ct">${ICONS[c.icon]||''}${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.value)}</a>`:`<span>${esc(c.value)}</span>`}</div>`).join('')}
        </div>
      </div>

      <div class="s-block">
        <div class="info-row"><span class="info-label">Born:</span><span class="info-value">${esc(d.persona.birthDate)}</span></div>
        <div class="info-row"><span class="info-label">From:</span><span class="info-value">${esc(d.persona.birthPlace)}</span></div>
        <div class="info-row"><span class="info-label">Living in:</span><span class="info-value">${esc(d.persona.livingIn)}</span></div>
      </div>

      <div class="s-block">
        <div class="s-title">Bio</div>
        <p class="bio-text">${bioHtml}</p>
      </div>

      <div class="s-block">
        <div class="s-title">Soft Skills</div>
        <div class="soft-grid">
          ${d.softSkills.map(s=>`<div class="soft-item"><span class="soft-dot"></span>${esc(s)}</div>`).join('')}
        </div>
      </div>

      <div class="s-block">
        <div class="s-title">Languages</div>
        ${d.languages.map(l=>`<div class="lang-row"><span class="lang-name">${esc(l.name)}</span><span class="lang-lvl">${esc(l.level)}</span></div>`).join('')}
      </div>

      <div class="s-block">
        <div class="s-title">Misc</div>
        ${d.misc.map(m=>`<div class="misc-item">${esc(m)}</div>`).join('')}
      </div>

      <div class="gdpr">${esc(d.gdpr)}</div>

    </div>
  </aside>`;

  const main=`
  <main class="main">
    <header class="main-header">
      <div class="name">${esc(d.persona.firstName)} <span>${esc(d.persona.lastName)}</span></div>
      <div class="role">${esc(d.persona.title)}</div>
    </header>
    <div class="main-body">

      <div class="sec">
        <div class="sec-title"><span class="sec-dot"></span>Education</div>
        ${d.education.map(e=>`<div class="edu"><div class="edu-top"><span class="edu-deg">${esc(e.degree)}</span><span class="edu-when">${esc(e.period)}</span></div><div class="edu-where">${esc(e.institution)}</div>${e.note?`<div class="edu-note">${esc(e.note)}</div>`:''}</div>`).join('')}
      </div>

      <div class="sec">
        <div class="sec-title"><span class="sec-dot"></span>Research Experience</div>
        ${d.experience.map(e=>`<div class="exp"><div class="exp-side"><span class="exp-when">${esc(e.period)}</span><span class="exp-where">${esc(e.location)}</span></div><div class="exp-body"><div class="exp-role">${esc(e.role)}</div><div class="exp-org">${esc(e.organisation)}</div><div class="exp-desc">${e.bullets?'<ul>'+e.bullets.map(b=>`<li>${esc(b)}</li>`).join('')+'</ul>':esc(e.description||'')}</div></div></div>`).join('')}
      </div>

      <div class="sec">
        <div class="sec-title"><span class="sec-dot"></span>Skills</div>
        ${d.skillAreas.map(s=>`<div class="skill-area"><div class="skill-area-name">${esc(s.area)}</div><div class="skill-area-items">${esc(s.items)}</div></div>`).join('')}
      </div>

      ${d.publications&&d.publications.length?`<div class="sec"><div class="sec-title"><span class="sec-dot"></span>Publications</div>${d.publications.map(p=>`<div class="pub"><div><div class="pub-title">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`:esc(p.title)}</div><div class="pub-venue">${esc(p.venue)}</div></div><span class="pub-year">${esc(p.year)}</span></div>`).join('')}</div>`:''}

      ${d.certifications&&d.certifications.length?`<div class="sec"><div class="sec-title"><span class="sec-dot"></span>Certifications</div>${d.certifications.map(c=>`<div class="cert-row"><div><span class="cert-name">${esc(c.title)}</span> <span class="cert-from">— ${esc(c.issuer)}</span></div><span class="cert-year">${esc(c.year)}</span></div>`).join('')}</div>`:''}

    </div>
  </main>`;

  document.getElementById('cv').innerHTML=sidebar+main;
}
render();
</script>
</body>
</html>
